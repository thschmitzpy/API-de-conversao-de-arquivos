global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: conversor-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  # Worker roda com N replicas atras de um Service headless: o registro A
  # devolve o IP de cada pod, e cada um vira um target separado.
  - job_name: conversor-worker
    metrics_path: /
    dns_sd_configs:
      - names: ["worker.conversor.svc.cluster.local"]
        type: A
        port: 9100
    relabel_configs:
      - target_label: service
        replacement: worker

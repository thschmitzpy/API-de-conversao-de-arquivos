apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: LoadBalancer
  # Preserva o IP do cliente. Com o padrao (Cluster) o trafego passa por SNAT e todos
  # chegariam ao nginx com o mesmo IP, dividindo a mesma cota do rate limit da API.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      containers:
        - name: frontend
          image: conversorarquivos-frontend:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          env:
            - name: CONVERSOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: conversor-secrets
                  key: FRONTEND_API_KEY
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi

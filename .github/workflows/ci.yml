name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Poetry
        run: pipx install poetry==1.8.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: poetry
      - name: Check poetry.lock
        run: poetry check --lock
      - name: Install dependencies
        run: poetry install --with dev --no-interaction --no-root
      - name: Ruff check
        run: poetry run ruff check .

  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://conversor:conversor@localhost:5434/conversor
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      MINIO_ENDPOINT: localhost:9000
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_INPUT: inputs
      MINIO_BUCKET_OUTPUT: outputs
      MINIO_SECURE: 'false'
      WEBHOOK_SIGNING_SECRET: ci-test-secret
      POSTGRES_USER: conversor
      POSTGRES_PASSWORD: conversor
      POSTGRES_DB: conversor
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      API_KEYS: dev-key-local
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env
        run: cp .env.example .env

      - name: Start services (Postgres, Redis, MinIO)
        run: docker compose up -d postgres redis minio

      - name: Install system dependencies (FFmpeg, Tesseract, LibreOffice)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-por \
            libreoffice-writer-nogui \
            libreoffice-calc-nogui \
            libreoffice-impress-nogui \
            fonts-liberation

      - name: Verify system binaries
        shell: bash
        run: |
          ffmpeg -version | head -n 1
          tesseract --version | head -n 1
          tesseract --list-langs | grep -qx por
          tesseract --list-langs | grep -qx eng
          soffice --version

      - name: Install Poetry
        run: pipx install poetry==1.8.4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: poetry

      - name: Install dependencies
        run: poetry install --with dev --no-interaction --no-root

      - name: Wait for services
        run: |
          for i in {1..30}; do pg_isready -h localhost -p 5434 -U conversor && break; sleep 2; done
          for i in {1..30}; do curl -sf http://localhost:9000/minio/health/live && break; sleep 2; done

      - name: Run migrations
        run: poetry run alembic upgrade head

      - name: Start Celery worker (background)
        run: |
          nohup poetry run celery -A app.broker.celery_app worker --loglevel=INFO > celery.log 2>&1 &
          sleep 5

      - name: Run tests
        run: poetry run pytest tests/ -v --cov --cov-report=term

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          echo "## Cobertura" >> "$GITHUB_STEP_SUMMARY"
          poetry run coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
          poetry run coverage html

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14

      - name: Dump celery log on failure
        if: failure()
        run: cat celery.log || true

      - name: Stop services
        if: always()
        run: docker compose down -v

  k8s:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.6.7
    steps:
      - uses: actions/checkout@v4

      # O kustomize nao le arquivos fora de k8s/ (load restrictor), entao os arquivos do
      # Grafana existem em dois lugares. O prometheus.yml fica de fora: o do cluster e
      # diferente de proposito (dns_sd_configs no Service headless do worker).
      - name: Check drift monitoring/ x k8s/monitoring/
        run: |
          status=0
          check() {
            if ! diff -u "$1" "$2"; then
              echo "::error file=$2::$2 divergiu de $1 - copie o arquivo de monitoring/ para k8s/monitoring/"
              status=1
            fi
          }
          check monitoring/grafana/dashboards/conversor.json k8s/monitoring/grafana/conversor.json
          check monitoring/grafana/provisioning/dashboards/dashboards.yml k8s/monitoring/grafana/dashboards.yml
          check monitoring/grafana/provisioning/datasources/prometheus.yml k8s/monitoring/grafana/datasources.yml
          exit $status

      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Render manifests (kustomize)
        run: |
          cp k8s/secrets.env.example k8s/secrets.env
          kubectl kustomize k8s > rendered.yaml

      - name: Validate manifests (kubeconform)
        run: kubeconform -strict -summary rendered.yaml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      # O build do React acontece aqui, na primeira etapa do Dockerfile.
      - name: Build image
        run: docker build -t conversor-frontend .

      # O nginx resolve o upstream ao validar a config; o --add-host so satisfaz essa resolucao.
      - name: Validate nginx config
        run: docker run --rm --add-host api:127.0.0.1 -e CONVERSOR_API_KEY=ci conversor-frontend nginx -t

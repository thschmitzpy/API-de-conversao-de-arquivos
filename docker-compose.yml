services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: conversor-api
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - ./app:/code/app
      - ./migrations:/code/migrations
      - ./alembic.ini:/code/alembic.ini
      - ./tests:/code/tests
    networks:
      - conversor-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: conversor-worker
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - ./app:/code/app
    networks:
      - conversor-net

  postgres:
    image: postgres:16-alpine
    container_name: conversor-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - conversor-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - conversor-net

  redis:
    image: redis:7-alpine
    container_name: conversor-redis
    ports:
      - "6379:6379"
    networks:
      - conversor-net

  minio:
    image: quay.io/minio/minio:latest
    container_name: conversor-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - conversor-minio:/data
    networks:
      - conversor-net

volumes:
  conversor-pg:
  conversor-minio:

networks:
  conversor-net:
    driver: bridge

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: conversor-api
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - ./app:/code/app
      - ./migrations:/code/migrations
      - ./alembic.ini:/code/alembic.ini
      - ./tests:/code/tests
    networks:
      - conversor-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: conversor-worker
    env_file: .env
    ports:
      - "9100:9100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - ./app:/code/app
      - ./tests:/code/tests
    networks:
      - conversor-net

  postgres:
    image: postgres:16-alpine
    container_name: conversor-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - conversor-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - conversor-net

  redis:
    image: redis:7-alpine
    container_name: conversor-redis
    ports:
      - "6379:6379"
    networks:
      - conversor-net

  minio:
    image: chainguard/minio:latest
    container_name: conversor-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - conversor-minio:/data
    networks:
      - conversor-net

  prometheus:
    image: prom/prometheus:latest
    container_name: conversor-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - conversor-prometheus:/prometheus
    depends_on:
      - api
      - worker
    networks:
      - conversor-net

  grafana:
    image: grafana/grafana:latest
    container_name: conversor-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - conversor-grafana:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - conversor-net

volumes:
  conversor-pg:
  conversor-minio:
  conversor-prometheus:
  conversor-grafana:

networks:
  conversor-net:
    driver: bridge

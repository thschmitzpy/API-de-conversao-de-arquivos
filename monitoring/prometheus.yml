global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: conversor-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  - job_name: conversor-worker
    metrics_path: /
    static_configs:
      - targets: ["worker:9100"]
        labels:
          service: worker
